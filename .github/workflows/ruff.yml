name: Formatting

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        name: Set up uv
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Format
        run: uv run --extra dev ruff format --check
