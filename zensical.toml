[project]
site_name = "nhisml"
site_description = "Survey-aware machine learning toolkit for NHIS Adults data"
site_url = "https://soda-lmu.github.io/nhisml/"
repo_url = "https://github.com/soda-lmu/nhisml"
repo_name = "soda-lmu/nhisml"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Command-line interface" = "cli.md" },
  { "Python API" = "api.md" },
  { "Reference statistics" = "reference_statistics.md" },
]

[project.theme]
logo = "assets/logo-mark.svg"
favicon = "assets/logo-mark.svg"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
